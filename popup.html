<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>浅译 LiteTrace</title>
    <script type="module" src="/src/popup.ts"></script>
  </head>
  <body>
    <div class="popup-shell">
      <section class="popup-card" id="popup-card">
        <div class="popup-brand">
          <img
            class="popup-symbol"
            src="/brand/litetrace-symbol.svg"
            alt="浅译 LiteTrace 图标"
          />
          <div>
            <p class="popup-kicker">LiteTrace</p>
            <h1>一键开启双语阅读</h1>
          </div>
        </div>

        <div class="status-chip" id="status-chip">读取状态中…</div>

        <div class="popup-copy">
          <p class="provider-line" id="provider-line">正在检查当前配置…</p>
          <p class="popup-description" id="popup-description">请稍等，LiteTrace 正在准备当前页面的使用状态。</p>
          <p class="popup-hint" id="popup-hint"></p>
        </div>

        <div class="popup-actions">
          <button class="primary-button" id="primary-button" type="button">
            稍候…
          </button>
          <button class="ghost-button" id="secondary-button" type="button" hidden>
            打开设置
          </button>
        </div>

        <div class="popup-feedback" id="popup-feedback" aria-live="polite"></div>
      </section>
    </div>
  </body>
</html>
