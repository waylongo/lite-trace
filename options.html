<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>浅译 LiteTrace 设置</title>
    <script type="module" src="/src/options.ts"></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="settings-card">
        <header class="page-header">
          <img
            class="brand-logo"
            src="/brand/litetrace-logo-horizontal.svg"
            alt="浅译 LiteTrace 标志"
          />
          <div class="page-copy">
            <p class="eyebrow">浅译 LiteTrace</p>
            <h1>浅译一下，就顺着读了</h1>
            <p class="page-description">
              配好一个翻译接口，之后点一下图标，就能开始双语阅读。
            </p>
          </div>
          <div class="meta-row" aria-label="当前状态">
            <div class="meta-item">
              <span class="meta-label">当前接口</span>
              <strong id="active-provider-label">读取中…</strong>
            </div>
            <div class="meta-badges">
              <span id="fields-status" class="status-badge" data-state="idle">待补充</span>
              <span id="connection-status" class="status-badge" data-state="idle">待授权</span>
            </div>
          </div>
        </header>

        <form id="settings-form" class="settings-form">
          <section class="settings-section">
            <div class="section-head">
              <h2>选择引擎</h2>
              <p>Google 更省事，OpenAI Compatible 更灵活。</p>
            </div>

            <div class="provider-picker" aria-label="翻译引擎">
              <button
                data-provider-tab="google"
                class="provider-button is-active"
                type="button"
                aria-pressed="true"
              >
                <span>Google Translate</span>
                <small>只需填写 API Key</small>
              </button>
              <button
                data-provider-tab="openai"
                class="provider-button"
                type="button"
                aria-pressed="false"
              >
                <span>OpenAI Compatible</span>
                <small>支持官方和兼容接口</small>
              </button>
            </div>
          </section>

          <section class="settings-section">
            <div class="section-head">
              <h2>填写信息</h2>
              <p>配置只保存在本地浏览器。</p>
            </div>

            <section class="provider-pane is-active" data-provider-pane="google">
              <label class="field">
                <span>Google Translate API Key</span>
                <input
                  id="google-api-key"
                  name="google-api-key"
                  type="password"
                  placeholder="AIza..."
                  autocomplete="off"
                />
                <small>用于整页双语阅读和划词翻译。</small>
              </label>
            </section>

            <section class="provider-pane" data-provider-pane="openai">
              <label class="field">
                <span>Base URL</span>
                <input
                  id="openai-base-url"
                  name="openai-base-url"
                  type="url"
                  placeholder="https://api.openai.com/v1"
                  autocomplete="off"
                />
                <small>误填到 `/chat/completions` 也会自动整理。</small>
              </label>

              <label class="field">
                <span>模型名称</span>
                <input
                  id="openai-model"
                  name="openai-model"
                  type="text"
                  placeholder="gpt-4.1-mini"
                  autocomplete="off"
                />
                <small>建议选择稳定、响应快的模型。</small>
              </label>

              <label class="field">
                <span>API Key</span>
                <input
                  id="openai-api-key"
                  name="openai-api-key"
                  type="password"
                  placeholder="sk-..."
                  autocomplete="off"
                />
                <small>只保存在本地。</small>
              </label>
            </section>
          </section>

          <section class="settings-section actions-section">
            <div class="section-head">
              <h2>保存设置</h2>
            </div>

            <div class="button-row">
              <button id="save-button" class="secondary-button" type="submit">
                保存
              </button>
              <button id="verify-button" class="primary-button" type="button">
                保存并验证
              </button>
            </div>
          </section>
        </form>

        <div id="feedback" class="feedback" aria-live="polite" hidden></div>

        <section id="success-panel" class="success-panel" hidden>
          <div>
            <h2 id="success-title">完成</h2>
            <p id="success-description">
              返回网页后，点击图标即可开始。
            </p>
          </div>
          <button id="finish-button" class="primary-button" type="button">
            返回开始使用
          </button>
        </section>
      </section>
    </main>
  </body>
</html>
